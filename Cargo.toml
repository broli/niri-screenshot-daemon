[workspace]
resolver = "3"
members = [
    "niri-screenshot-daemon",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Lightweight multi-session screenshot watchdog for Niri"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
rustix = { version = "1.0", features = ["process"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

[profile.release]
lto = true
codegen-units = 1
strip = true

